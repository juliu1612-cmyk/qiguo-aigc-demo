<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI翻译系统 - 合集管理（演示）</title>
<style>
:root{
  --blue:#409eff; --blue-l:#ecf5ff; --blue-b:#b3d8ff;
  --green:#67c23a; --green-l:#f0f9eb; --green-b:#e1f3d8;
  --orange:#e6a23c; --orange-l:#fdf6ec; --orange-b:#faecd8;
  --red:#f56c6c; --red-l:#fef0f0; --red-b:#fde2e2;
  --t1:#303133; --t2:#606266; --t3:#909399; --t4:#c0c4cc;
  --bd:#ebeef5; --bd2:#dcdfe6; --bg:#f0f2f5;
  --side:#304156; --side-hover:#263445;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  font-size:12px;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c8cdd4;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}

/* ============ 侧边栏 ============ */
.sidebar{width:172px;flex:0 0 172px;background:var(--side);overflow-y:auto;overflow-x:hidden;padding-bottom:20px}
.sidebar::-webkit-scrollbar-thumb{background:#4a5c6e}
.logo{height:50px;display:flex;align-items:center;gap:8px;padding-left:16px;color:#fff;font-size:13px;letter-spacing:.5px}
.logo .logo-dot{width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,#409eff,#1f6fd0);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
.mi{display:flex;align-items:center;height:44px;padding-left:16px;cursor:pointer;color:#bfcbd9;
  font-size:13px;position:relative;user-select:none;transition:.15s}
.mi:hover{background:var(--side-hover)}
.mi .ico{width:16px;height:16px;margin-right:9px;flex:0 0 16px;opacity:.9}
.mi .arrow{margin-left:auto;margin-right:14px;font-size:9px;color:#8a98a8;transition:.2s;transform:rotate(0)}
.mi.open>.arrow{transform:rotate(90deg)}
.mi.active{background:var(--side-hover);color:#fff}
.mi .text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:none}
.sub.show{display:block}
.sub .si{height:38px;line-height:38px;padding-left:41px;color:#bfcbd9;font-size:12.5px;cursor:pointer;white-space:nowrap}
.sub .si:hover{background:var(--side-hover)}
.sub .si.active{background:#263445;color:#fff}

/* ============ 主区 ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:50px;flex:0 0 50px;background:#fff;display:flex;align-items:center;padding:0 16px;gap:10px;
  border-bottom:1px solid #e8eaec}
.burger{width:16px;cursor:pointer;opacity:.55}
.crumb{font-size:13px;color:#606266;display:flex;align-items:center;gap:6px}
.crumb .sep{color:#c0c4cc}
.crumb .cur{color:#303133}
.top-right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:12.5px;color:#606266}
.fault{color:#e6a23c;font-weight:600;letter-spacing:.2px}
.top-search{width:160px;height:28px;border:1px solid var(--bd2);border-radius:14px;display:flex;align-items:center;
  padding:0 10px;gap:6px;background:#fff;color:#c0c4cc}
.top-search input{border:0;outline:0;font-size:12px;width:100%;color:#606266;background:transparent}
.top-search input::placeholder{color:#c0c4cc}
.fullscreen{display:flex;align-items:center;gap:4px;cursor:pointer;color:#606266}
.avatar-box{display:flex;align-items:center;gap:6px;cursor:pointer}
.avatar{width:24px;height:24px;border-radius:50%;background:#409eff;color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:11px}

/* 标签栏 */
.tagsbar{height:35px;flex:0 0 35px;background:#fff;display:flex;align-items:center;gap:5px;padding:0 10px;
  border-bottom:1px solid #e8eaec;overflow-x:auto}
.tag{display:flex;align-items:center;gap:6px;height:24px;padding:0 7px;border:1px solid #d8dce5;background:#fff;
  color:#495060;font-size:12px;cursor:pointer;border-radius:2px;white-space:nowrap}
.tag .dot{width:8px;height:8px;border-radius:50%;background:transparent}
.tag.active{color:var(--blue);border-color:#b3d8ff;background:#ecf5ff}
.tag.active .dot{background:var(--blue)}
.tag .x{font-size:12px;color:#98a1ac;line-height:1;padding:0 1px}
.tag .x:hover{color:#f56c6c;background:#f0f0f0;border-radius:50%}

.content{flex:1;overflow:auto;background:var(--bg);padding:10px 12px}

/* ============ 卡片 / 通用 ============ */
.card{background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.list-card{padding:14px 16px 0}
.detail-card{padding:14px 18px 0}

.btn{height:28px;padding:0 15px;font-size:12px;border-radius:3px;border:1px solid var(--bd2);background:#fff;
  color:var(--t2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.btn:hover{color:var(--blue);border-color:#c6e2ff;background:#ecf5ff}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#66b1ff;border-color:#66b1ff;color:#fff}
.btn-plain{border-color:var(--bd2);color:var(--t2);background:#fff}
.btn-plain:hover{color:var(--blue);border-color:#c6e2ff;background:#ecf5ff}
.btn i{font-style:normal;display:inline-flex;align-items:center}
.btn-icon{width:28px;height:28px;border:1px solid var(--bd2);background:#fff;color:var(--t3);border-radius:3px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{color:var(--blue);border-color:#c6e2ff;background:#ecf5ff}

.f-input{height:28px;border:1px solid #e2e6eb;background:#f7f8fa;border-radius:4px;display:flex;align-items:center;
  padding:0 8px;gap:5px;color:#c0c4cc}
.f-input input{border:0;outline:0;background:transparent;font-size:12px;color:#606266;width:118px}
.f-input input::placeholder{color:#bfc5cd}
.f-input .sico{opacity:.45;flex:0 0 12px}
.f-select{height:28px;border:1px solid #e2e6eb;background:#f7f8fa;border-radius:4px;display:flex;align-items:center;
  padding:0 8px;gap:8px;color:#bfc5cd;font-size:12px;cursor:pointer;position:relative;white-space:nowrap}
.f-select.has{color:#606266}
.f-select .caret{font-size:8px;color:#b7bec7;margin-left:auto}
.f-select select{position:absolute;inset:0;opacity:0;cursor:pointer}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filter-row .spacer{flex:1}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{background:#f7f8fa;color:#606266;font-weight:500;font-size:12px;text-align:center;
  padding:10px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl td{padding:11px 6px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--t2);
  text-align:center;word-break:break-all;line-height:1.5}
.tbl td.l{text-align:left;padding-left:10px}
.tbl tr:hover td{background:#fafcff}
.tbl .ck{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;vertical-align:middle}
.link{color:var(--blue);cursor:pointer;white-space:nowrap}
.link:hover{text-decoration:underline}
.link-sep{color:#dcdfe6;margin:0 5px}
.ops{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:nowrap}
.name-cell{color:#303133;cursor:pointer}
.name-cell:hover{color:var(--blue);text-decoration:underline}

.tag-s{display:inline-flex;align-items:center;height:20px;padding:0 5px;border-radius:2px;font-size:11.5px;
  border:1px solid transparent;white-space:nowrap}
.t-green{background:var(--green-l);border-color:var(--green-b);color:var(--green)}
.t-orange{background:var(--orange-l);border-color:var(--orange-b);color:var(--orange)}
.t-red{background:var(--red-l);border-color:var(--red-b);color:var(--red)}
.t-blue{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue)}
.t-gray{background:#f4f4f5;border-color:#e9e9eb;color:#909399}
.p-orange{color:var(--orange)}
.p-green{color:var(--green)}
.p-red{color:var(--red)}
.dot-warn{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--red);color:var(--red);
  font-size:9px;line-height:10px;text-align:center;vertical-align:middle;margin-left:3px;font-style:normal}

.tbl-footer{display:flex;align-items:center;padding:12px 4px;font-size:12px;color:var(--t3)}
.pager{margin-left:auto;display:flex;align-items:center;gap:6px}
.pg{min-width:26px;height:26px;padding:0 6px;border-radius:2px;background:#f4f4f5;color:#606266;display:flex;
  align-items:center;justify-content:center;cursor:pointer;font-size:12px}
.pg:hover{color:var(--blue)}
.pg.on{background:var(--blue);color:#fff}
.pg.ellipsis{background:transparent;cursor:default}
.pgsize{height:26px;border:1px solid var(--bd2);border-radius:2px;padding:0 6px;color:#606266;font-size:12px;
  display:flex;align-items:center;gap:10px;cursor:pointer;margin-left:6px}

/* 详情页头 */
.detail-head{display:flex;align-items:center;padding-bottom:12px}
.detail-head .cur{font-size:13px;color:var(--t2)}
.detail-head .cur b{color:#303133;font-weight:600}
.detail-head .r{margin-left:auto}
.steps{display:flex;align-items:center;gap:26px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.step{padding:0 1px 10px;font-size:13px;color:var(--t2);cursor:pointer;position:relative;top:1px;border-bottom:2px solid transparent}
.step:hover{color:var(--blue)}
.step.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}

.subtabs{display:flex;align-items:center;gap:22px;margin:2px 0 14px}
.stab{font-size:12.5px;color:var(--t2);cursor:pointer;padding-bottom:5px;border-bottom:2px solid transparent}
.stab:hover{color:var(--blue)}
.stab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}

.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.status-tabs{display:flex;align-items:center;gap:15px}
.st{font-size:12px;color:var(--t3);cursor:pointer;white-space:nowrap}
.st:hover{color:var(--blue)}
.st.on{color:#303133;font-weight:600}
.right-filters{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}

.chips{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.chip{height:24px;padding:0 11px;border:1px solid var(--bd2);border-radius:12px;font-size:12px;color:var(--t2);
  display:flex;align-items:center;cursor:pointer;background:#fff}
.chip:hover{color:var(--blue);border-color:#c6e2ff}
.chip.on{color:var(--blue);border-color:var(--blue-b);background:var(--blue-l)}

.tbl-wrap{overflow-x:auto}
.tbl-wide{min-width:1600px}

/* 术语提取 */
.term-wrap{display:flex;border:1px solid var(--bd);border-radius:3px;min-height:430px}
.term-left{width:240px;flex:0 0 240px;border-right:1px solid var(--bd);padding:12px}
.term-left .btn{width:100%;justify-content:center;margin-bottom:10px}
.term-file{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:3px;cursor:pointer;font-size:12px;color:#606266}
.term-file:hover{background:#f5f7fa}
.term-file .fl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-right{flex:1;padding:14px 16px;display:flex;flex-direction:column}
.term-right .lbl{font-size:12.5px;color:#303133;margin-bottom:9px}
.term-right .sel{height:32px;border:1px solid var(--bd2);border-radius:3px;display:flex;align-items:center;
  padding:0 10px;color:#c0c4cc;font-size:12px;cursor:pointer}
.term-right .foot{margin-top:auto;display:flex;justify-content:flex-end}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;
  z-index:1000;padding-top:12vh;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{background:#fff;border-radius:4px;width:520px;max-width:94vw;box-shadow:0 8px 30px rgba(0,0,0,.2);
  animation:pop .2s ease;max-height:78vh;display:flex;flex-direction:column}
@keyframes pop{from{transform:translateY(-12px);opacity:.6}to{transform:none;opacity:1}}
.dlg-h{padding:16px 20px 10px;font-size:15px;color:#303133;display:flex;align-items:center}
.dlg-h .x{margin-left:auto;color:#c0c4cc;cursor:pointer;font-size:15px;line-height:1}
.dlg-h .x:hover{color:#909399}
.dlg-b{padding:6px 20px 14px;overflow:auto;font-size:12.5px;color:#606266}
.dlg-f{padding:10px 20px 16px;display:flex;justify-content:flex-end;gap:10px}
.dlg-f .btn{height:30px;padding:0 18px}
.form-item{display:flex;margin-bottom:16px;align-items:flex-start}
.form-item .lab{width:104px;flex:0 0 104px;text-align:right;padding-right:12px;line-height:30px;color:#606266;font-size:12.5px;white-space:nowrap}
.form-item .lab .req{color:#f56c6c;margin-right:3px}
.form-item .ctl{flex:1;min-width:0}
.inp{width:100%;height:30px;border:1px solid var(--bd2);border-radius:3px;padding:0 10px;font-size:12.5px;
  color:#303133;outline:0;font-family:inherit}
.inp:focus{border-color:var(--blue)}
.inp[disabled]{background:#f5f7fa;color:#c0c4cc;cursor:not-allowed}
textarea.inp{height:auto;padding:7px 10px;resize:vertical;line-height:1.6}
.sel2{width:100%;height:30px;border:1px solid var(--bd2);border-radius:3px;padding:0 8px;font-size:12.5%;
  color:#303133;outline:0;background:#fff;font-family:inherit}
.counter{text-align:right;font-size:11.5px;color:#c0c4cc;margin-top:3px}
.sel-fake{position:relative;display:flex;align-items:center;height:30px;border:1px solid var(--bd2);border-radius:3px;
  padding:0 10px;font-size:12.5px;color:#303133;cursor:pointer;background:#fff;user-select:none}
.sel-fake:hover{border-color:#c0c4cc}
.sel-fake .caret{margin-left:auto;font-size:9px;color:#c0c4cc;transition:.2s}
.sel-fake.open .caret{transform:rotate(180deg)}
.sel-fake .dd{display:none;position:absolute;left:0;right:0;top:32px;background:#fff;border:1px solid var(--bd);
  border-radius:3px;box-shadow:0 2px 12px rgba(0,0,0,.1);z-index:10;padding:4px 0}
.sel-fake.open .dd{display:block}
.sel-fake .dd div{padding:8px 10px;font-size:12.5px;color:#606266}
.sel-fake .dd div:hover{background:#f5f7fa}
.sel-fake .dd div.on{color:var(--blue);font-weight:600;background:var(--blue-l)}
.sel-fake .dd div.off{color:#c0c4cc;cursor:not-allowed;background:#fff}
.sel-fake .dd div.off:hover{background:#fff}
.sel-fake .dd div.off em{font-style:normal;font-size:11px;color:#c0c4cc;margin-left:6px}
.sel-fake.dis{background:#f5f7fa;cursor:not-allowed;color:#c0c4cc}
.sel-fake.dis:hover{border-color:var(--bd2)}
.radio-group{display:flex;align-items:center;gap:22px;height:30px}
.radio-group .rd{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#606266;cursor:pointer;user-select:none}
.radio-group .rd i{position:relative;flex:0 0 auto;width:14px;height:14px;border:1px solid #dcdfe6;border-radius:50%;
  box-sizing:border-box;background:#fff;transition:border-color .2s,background .2s}
.radio-group .rd:hover i{border-color:var(--blue)}
.radio-group .rd.on{color:var(--blue)}
.radio-group .rd.on i{border-color:var(--blue);background:var(--blue)}
.radio-group .rd.on i::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;
  border-radius:50%;background:#fff}
.radio-group .rd.off{color:#c0c4cc;cursor:not-allowed}
.radio-group .rd.off i{border-color:#e4e7ed;background:#f5f7fa}
.radio-group .rd.off:hover i{border-color:#e4e7ed}
.radio-group .rd em{font-style:normal;font-size:11px;color:#c0c4cc}

/* 视频弹窗 */
.vmask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1100;display:flex;align-items:center;justify-content:center}
.vbox{width:480px;background:#fff;border-radius:4px;padding:14px 14px 10px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.vbox .vh{display:flex;align-items:center;font-size:14px;color:#303133;margin-bottom:10px;padding:0 2px}
.vbox .vh .x{margin-left:auto;cursor:pointer;color:#c0c4cc}
.screen{height:330px;border-radius:2px;background:radial-gradient(120% 90% at 30% 20%,#3a2b33 0%,#1c1418 55%,#0c0a0b 100%);
  position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.screen .ph{color:#6b5a63;font-size:12px;letter-spacing:2px;text-align:center}
.screen .ph .big{font-size:20px;color:#8d7681;letter-spacing:4px;margin-bottom:8px}
.vc{display:flex;align-items:center;gap:12px;padding:9px 4px 2px;color:#606266;font-size:11.5px}
.vc .bar{flex:1;height:3px;background:#e4e7ed;border-radius:2px;position:relative;cursor:pointer}
.vc .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:2px}
.vc .ico{width:14px;height:14px;cursor:pointer;opacity:.75}
.vc .ico:hover{opacity:1}
.vc .txt{font-variant-numeric:tabular-nums;white-space:nowrap}

/* 抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1050}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:92vw;background:#fff;z-index:1051;
  display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.12);animation:slide .22s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.7}to{transform:none;opacity:1}}
.dw-h{height:48px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--bd);font-size:14px;color:#303133}
.dw-h .x{margin-left:auto;cursor:pointer;color:#c0c4cc}
.dw-tabs{padding:12px 18px 0;display:flex;gap:20px;border-bottom:1px solid var(--bd)}
.dw-body{flex:1;overflow:auto;padding:0 18px}
.up-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f2f3f5}
.up-item .nm{flex:1;min-width:0}
.up-item .nm .t{font-size:12.5px;color:#303133;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-item .nm .s{font-size:11.5px;color:#909399;margin-top:3px}
.empty{padding:70px 0;text-align:center;color:#c0c4cc;font-size:12.5px}
.empty .ei{font-size:34px;color:#e4e7ed;margin-bottom:10px}

/* toast */
#toast-wrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;
  flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:#f0f9eb;border:1px solid #e1f3d8;color:#67c23a;padding:9px 16px;border-radius:4px;font-size:12.5px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;align-items:center;gap:7px;animation:tin .25s ease}
.toast.err{background:#fef0f0;border-color:#fde2e2;color:#f56c6c}
.toast.info{background:#f4f4f5;border-color:#e9e9eb;color:#909399}
@keyframes tin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

/* 姓名卡 */
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pcard{border:1px solid var(--bd);border-radius:3px;overflow:hidden;position:relative}
.pcard .ph{height:112px;background:linear-gradient(135deg,#4a3b46,#241d22);display:flex;align-items:center;
  justify-content:center;color:#a1909a;font-size:11px;letter-spacing:1px}
.pcard .info{padding:7px 8px;font-size:12px;color:#303133;display:flex;align-items:center}
.pcard .info .del{margin-left:auto;color:#f56c6c;cursor:pointer;font-size:11.5px}
.pcard .info .role{color:#909399;font-size:11px;margin-left:6px}
.hint{color:#909399;font-size:11.5px;line-height:1.7}

/* 列表页统计 */
.small-note{font-size:11.5px;color:#a8b0ba}

/* ===== 提取字幕 · 框选页 ===== */
.extract-card{background:#fff;border-radius:3px;padding:10px 0 12px;display:flex;flex-direction:column}
.ex-head{display:flex;align-items:center;gap:14px;padding:2px 14px 10px}
.ex-title{font-size:13.5px;color:#303133;font-weight:600;white-space:nowrap}
.ex-nav{display:flex;align-items:center;gap:14px;position:relative;font-size:12px;color:#909399}
.ex-link{cursor:pointer;white-space:nowrap}
.ex-link:hover{color:var(--blue)}

.ep-item:hover{background:#f5f7fa}
.ep-item.on{color:var(--blue);background:var(--blue-l)}
.ex-tip{margin-left:auto;font-size:11.5px;color:#b3bac3}
.video-stage{background:#000;margin:0 14px;height:calc(100vh - 300px);min-height:340px;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.vframe{position:relative;height:100%;aspect-ratio:9/16;background:#120d0d;overflow:hidden;user-select:none}
.scene{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(46% 30% at 46% 22%, rgba(214,186,160,.42), rgba(214,186,160,0) 72%),
    radial-gradient(40% 26% at 66% 46%, rgba(122,138,160,.28), rgba(122,138,160,0) 70%),
    linear-gradient(180deg,#2a1f1d 0%,#1c1413 46%,#0e0a0a 100%)}
.scene::before{content:'';position:absolute;left:14%;top:2%;width:78%;height:62%;
  background:linear-gradient(160deg,rgba(196,170,146,.34),rgba(196,170,146,0) 62%);
  filter:blur(10px)}
.scene::after{content:'';position:absolute;left:0;right:0;bottom:0;height:58%;
  background:linear-gradient(180deg,rgba(8,6,6,0),rgba(6,4,4,.88))}
.sc-cap{position:absolute;left:6%;right:6%;top:79%;text-align:center;color:#fff;font-size:13.5px;
  text-shadow:0 1px 3px rgba(0,0,0,.9);letter-spacing:.5px}
.cropbox{position:absolute;background:rgba(0,0,0,.45);cursor:move;z-index:5;
  outline:1px dashed rgba(255,255,255,.65);outline-offset:-1px}
.cropbox .edge{position:absolute;background:rgba(255,255,255,.7);z-index:6}
.edge.t{left:0;right:0;top:-2px;height:4px;cursor:ns-resize}
.edge.b{left:0;right:0;bottom:-2px;height:4px;cursor:ns-resize}
.edge.l{top:0;bottom:0;left:-2px;width:4px;cursor:ew-resize}
.edge.r{top:0;bottom:0;right:-2px;width:4px;cursor:ew-resize}
.vctrl{margin:0 14px;background:#000;padding-bottom:2px}
.vbar{height:3px;background:rgba(255,255,255,.22);cursor:pointer;position:relative}
.vbar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.vrow{display:flex;align-items:center;gap:14px;padding:7px 10px;color:#dcdfe6;font-size:12px}
.vbtn{cursor:pointer;opacity:.85;font-size:12px;letter-spacing:.5px}
.vbtn:hover{opacity:1}
.vbtn.rate{font-size:11.5px}
.vtime{font-variant-numeric:tabular-nums;color:#e6e6e6;font-size:11.5px}
.vrow .spacer{flex:1}
.ex-foot{display:flex;justify-content:flex-end;padding:12px 14px 0}
.ex-steps{padding:4px 0 2px}
.ex-step{display:flex;align-items:center;gap:12px;padding:9px 2px}
.ex-step .ex-ico{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1.5px solid #dcdfe6;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:.2s}
.ex-step[data-st="pending"] .ex-ico::after{content:'';width:6px;height:6px;border-radius:50%;background:#dcdfe6}
.ex-step[data-st="active"] .ex-ico{border-color:var(--blue)}
.ex-step[data-st="active"] .ex-ico::after{content:'';width:9px;height:9px;border:2px solid var(--blue);
  border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.ex-step[data-st="done"] .ex-ico{border-color:var(--green);background:var(--green)}
.ex-step[data-st="done"] .ex-ico::after{content:'✓'}
.ex-step .ex-txt .t{font-size:12.5px;color:#303133}
.ex-step[data-st="pending"] .ex-txt .t{color:#909399}
.ex-step .ex-txt .s{font-size:11.5px;color:#909399;margin-top:2px}
.ex-step[data-st="active"] .ex-txt .s{color:var(--blue)}
.ex-step[data-st="done"] .ex-txt .s{color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
.ex-hint{margin-top:10px;font-size:11.5px;color:#a8b0ba}
.pip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;
  background:var(--blue-l);border:1px solid var(--blue-b);color:var(--blue);font-size:11.5px}
.pip i{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
</style>

function renderMenu(){
  const el = document.getElementById('menu');
  el.innerHTML = MENU.map((m,idx)=>{
    const svg = `<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="#bfcbd9" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">${ICON[m.i]||ICON.grid}</svg>`;
    if(m.children){
      return `<div class="mi ${m.open?'open':''}" data-menu="${idx}">
        ${svg}<span class="text">${m.t}</span><span class="arrow">▶</span>
      </div>
      <div class="sub ${m.open?'show':''}" data-sub="${idx}">
        ${m.children.map(c=>`<div class="si ${c==='合集管理'?'active':''}" data-leaf="${c}">${c}</div>`).join('')}
      </div>`;
    }
    return `<div class="mi" data-leaf="${m.t}">${svg}<span class="text">${m.t}</span>${m.arr?'<span class="arrow">▶</span>':''}</div>`;
  }).join('');
}
renderMenu();

document.getElementById('menu').addEventListener('click', e=>{
  const si = e.target.closest('.si');
  if(si){ toast(`「${si.dataset.leaf}」模块演示版本未实现`, 'info'); return; }
  const mi = e.target.closest('.mi');
  if(!mi) return;
  const idx = +mi.dataset.menu;
  if(!isNaN(idx) && MENU[idx].children){
    mi.classList.toggle('open');
    mi.nextElementSibling.classList.toggle('show');
    return;
  }
  const leaf = mi.dataset.leaf;
  if(leaf && leaf!=='合集管理') toast(`「${leaf}」模块演示版本未实现`, 'info');
});

   标签栏
   ========================================================= */
function renderTags(){
  const bar = document.getElementById('tagsbar');
  bar.innerHTML = state.openTabs.map(t=>`
    <div class="tag ${state.activeTab===t.key?'active':''}" data-tabkey="${t.key}">
      <span class="dot"></span>${t.label}
      <span class="x" data-close="${t.key}">✕</span>
    </div>`).join('');
}
document.getElementById('tagsbar').addEventListener('click', e=>{
  const c = e.target.closest('[data-close]');
  if(c){
    const key = c.dataset.close;
    state.openTabs = state.openTabs.filter(t=>t.key!==key);
    if(key==='extract'){ state.extract=null; clearInterval(exTimer); }
    if(state.activeTab===key){
      state.activeTab = key==='extract' ? 'detail' : 'list';
      go(state.activeTab);
    }
    else renderTags();
    return;
  }
  const t = e.target.closest('[data-tabkey]');
  if(!t) return;
  const key = t.dataset.tabkey;
  if(key==='home'){ toast('「首页（新）」模块演示版本未实现','info'); return; }
  if(key==='detail' && !DETAIL[state.detail.id]){ return; }
  if(key==='extract' && !state.extract){ return; }
  state.activeTab = key; go(key);
});

/* =========================================================
   路由
   ========================================================= */
function go(page){
  state.activeTab = page;
  if(page==='list'){ state.route={page:'list'}; renderList(); }
  else if(page==='extract'){ state.route={page:'extract'}; renderExtract(); }
  else { state.route={page:'detail'}; clearInterval(exTimer); renderDetail(); }
  renderTags();
  const crumb = document.getElementById('crumb');
  crumb.innerHTML = page==='list'
    ? '<span>AI翻译系统</span><span class="sep">/</span><span class="cur">合集管理</span>'
    : page==='extract'
      ? '<span>AI翻译系统</span><span class="sep">/</span><span class="cur">提取字幕</span>'
      : '<span>AI翻译系统</span><span class="sep">/</span><span class="cur">合集详情</span>';
}

const overlay = document.getElementById('overlay');

function toast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err'?' err':type==='info'?' info':'');
  el.innerHTML = `<span>${type==='err'?'✕':type==='info'?'ⓘ':'✓'}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.25s'; setTimeout(()=>el.remove(),260); }, 2200);
}

function dialog({title, body, footer, width, onMount}){
  overlay.innerHTML = `
    <div class="mask">
      <div class="dlg" style="width:${width||520}px">
        <div class="dlg-h">${title}<span class="x" data-x>✕</span></div>
        <div class="dlg-b">${body}</div>
        <div class="dlg-f">${footer}</div>
      </div>
    </div>`;
  const mask = overlay.querySelector('.mask');
  const close = ()=> overlay.innerHTML='';
  mask.addEventListener('click', e=>{ if(e.target===mask) close(); });
  overlay.querySelector('[data-x]').onclick = close;
  overlay.querySelectorAll('[data-close-dlg]').forEach(b=>b.onclick=close);
  if(onMount) onMount(close);
  return close;
}

function confirmDlg(title, text, onOk){
  dialog({
    title,
    body:`<div style="padding:6px 0 10px;font-size:13px;color:#606266">${text}</div>`,
    width:420,
    footer:`<button class="btn" data-close-dlg>取 消</button>
            <button class="btn btn-primary" data-ok>确 定</button>`,
    onMount(close){
      overlay.querySelector('[data-ok]').onclick = ()=>{ close(); onOk&&onOk(); };
    }
  });
}

function nowStr(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

              <div data-pick="ASR音频转写">ASR音频转写</div>
            </div>
          </div>
        </div></div>
      <div class="form-item"><div class="lab"><span class="req">*</span>提取API</div>
        <div class="ctl">
          <div class="radio-group" id="exApi">
            <label class="rd on" data-pick="阿里"><i></i><span>阿里</span></label>
            <label class="rd" data-pick="鬼手"><i></i><span>鬼手</span></label>
          </div>
        </div></div>
      <div class="form-item"><div class="lab"><span class="req">*</span>提取字幕语言</div>
        <div class="ctl"><input class="inp" value="${d.lang}（自动识别）" disabled></div></div>`,
    footer:`<button class="btn btn-primary" style="width:100%;justify-content:center" data-ok>字幕提取</button>`,
    onMount(close){
      const wayEl = document.getElementById('exWay');
      const apiEl = document.getElementById('exApi');
      const apiRds = [...apiEl.querySelectorAll('.rd')];
      const curApi = ()=>{ const on = apiEl.querySelector('.rd.on'); return on ? on.dataset.pick : '阿里'; };
      const setApi = pick=> apiRds.forEach(r=>r.classList.toggle('on', r.dataset.pick===pick));

      // 方式 → API 联动：ASR音频转写 仅支持 鬼手
      const syncApiLimit = ()=>{
        const isAsr = wayEl.querySelector('[data-way]').textContent.trim() === 'ASR音频转写';
        const aliRd = apiRds.find(r=>r.dataset.pick==='阿里');
        aliRd.classList.toggle('off', isAsr);
        aliRd.querySelector('span').innerHTML = isAsr ? '阿里<em style="margin-left:4px">ASR 不支持</em>' : '阿里';
        if(isAsr && curApi() === '阿里'){
          setApi('鬼手');
          toast('ASR音频转写仅支持「鬼手」API，已自动切换');
        }
      };

      wayEl.onclick = e=>{
        if(e.target.dataset.pick){
          wayEl.querySelector('[data-way]').textContent = e.target.dataset.pick;
          wayEl.querySelectorAll('.dd div').forEach(x=>x.classList.toggle('on', x.dataset.pick===e.target.dataset.pick));
          wayEl.classList.remove('open');
          syncApiLimit();
          return;
        }
        wayEl.classList.toggle('open');
      };

      apiEl.onclick = e=>{
        const rd = e.target.closest('.rd');
        if(!rd) return;
        if(rd.classList.contains('off')){
          toast('ASR音频转写仅支持「鬼手」API','err');
          return;
        }
        setApi(rd.dataset.pick);
      };

      overlay.querySelector('[data-ok]').onclick = ()=>{
        const picked = wayEl.querySelector('[data-way]').textContent.trim();
        const api = curApi();
        close();
        if(picked === 'ASR音频转写'){
          // 音频转写不需要框选区域，直接提交任务
          state.detail.step = 'sub';
          go('detail');
          submitExtract(rows, picked, api, 0);
          return;
        }
        openExtractPage(rows, picked, api);
      };
    }
  });
}

function startVideoTimer(){
  clearInterval(exTimer);
  const ex = state.extract;
  if(!ex) return;
  exTimer = setInterval(()=>{
    if(!ex.playing) return;
    ex.t = Math.min(ex.dur, ex.t + ex.speed*0.25);
    const curEl = document.getElementById('vcur');
    const bar = document.getElementById('vbar');
    if(curEl) curEl.textContent = fmtT(ex.t);
    if(bar) bar.style.width = (ex.t/ex.dur*100).toFixed(2)+'%';
    if(ex.t >= ex.dur){
      ex.playing = false;
      const p = document.getElementById('vplay');
      if(p) p.textContent = '▶';
    }
  }, 250);
}

const clampN = (v,a,b)=>Math.max(a, Math.min(b, v));

function bindCrop(){
  const frame = document.getElementById('vframe');
  const box = document.getElementById('cropbox');
  const ex = state.extract;
  if(!frame || !box || !ex) return;
  const apply = ()=>{
    const b = ex.box;
    box.style.left = b.x+'%';
    box.style.top = b.y+'%';
    box.style.width = b.w+'%';
    box.style.height = b.h+'%';
  };
  apply();

  box.addEventListener('mousedown', e=>{
    e.preventDefault();
    const edge = e.target.dataset.edge || null;
    const r = frame.getBoundingClientRect();
    const drag = {edge, sx:e.clientX, sy:e.clientY, o:{...ex.box}, rw:r.width, rh:r.height};

    const onMove = ev=>{
      const dx = (ev.clientX-drag.sx)/drag.rw*100;
      const dy = (ev.clientY-drag.sy)/drag.rh*100;
      const o = drag.o;
      if(!drag.edge){
        ex.box.x = clampN(o.x+dx, 0, 100-o.w);
        ex.box.y = clampN(o.y+dy, 0, 100-o.h);
      } else {
        let l=o.x, t=o.y, rt=o.x+o.w, bt=o.y+o.h;
        if(drag.edge==='left')  l  = clampN(o.x+dx, 0, rt-8);
        if(drag.edge==='right') rt = clampN(o.x+o.w+dx, l+8, 100);
        if(drag.edge==='top')   t  = clampN(o.y+dy, 0, bt-4);
        if(drag.edge==='bottom')bt = clampN(o.y+o.h+dy, t+4, 100);
        ex.box = {x:l, y:t, w:rt-l, h:bt-t};
      }
      apply();
    };
    const onUp = ()=>{
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.cursor = '';
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.body.style.cursor = edge ? (edge==='top'||edge==='bottom'?'ns-resize':'ew-resize') : 'move';
  });
}

function submitExtract(rows, way, api, skipped){
  const d = DETAIL[state.detail.id];
  let finished = 0;
  rows.forEach((src, idx)=>{
    const old = d.sub.find(s=>s.name===src.name);
    const task = old || {
      id: String(90000 + Math.floor(Math.random()*8999)),
      name: src.name, src: way, api: api, lang: d.lang, by:'刘同金', auditor:'-', end:'管理端',
      audit:'未审改', prog:'处理中', pct:0, role:'-', hasCard:'否',
      markBy:'-', markEnd:'管理端', mark:'未标记',
      auditAt:'-', auditDone:'-', markAt:'-', markDone:'-', ct: nowStr(), _new:true
    };
    if(old){
      Object.assign(old, {src: way, api: api, prog:'处理中', pct:0, ct: nowStr(), audit:'未审改', auditor:'-', role:'-', _new:true});
    } else {
      d.sub.unshift(task);
    }
    const timer = setInterval(()=>{
      task.pct = Math.min(100, task.pct + 9 + Math.floor(Math.random()*12));
      if(task.pct >= 100){
        task.pct = 100;
        task.prog = '成功';
        task.role = '0%';
        clearInterval(timer);
        finished++;
        if(finished === rows.length){
          toast(`字幕提取完成：${rows.length} 个字幕已入「源字幕库」`);
        }
      }
      if(state.detail.step==='sub') renderStep();
      else if(state.detail.step==='first') refreshPip();
    }, 620 + idx*160);
  });
  state.detail.sel.clear();
  renderStep();
  toast(`已提交 ${rows.length} 个字幕提取任务${way==='ASR音频转写'?(api?'（ASR · '+api+'）':''):''}${skipped?`（其中 ${skipped} 个重新提取）`:''}`);
  setTimeout(()=>{
    if(state.detail.step==='first') refreshPip();
  }, 300);
}

function refreshPip(){
  const d = DETAIL[state.detail.id];
  const ing = d.sub.filter(x=>x.prog==='处理中').length;
  let el = document.querySelector('.pip');
  if(!ing){ if(el) el.remove(); return; }
  if(!el){
    const box = document.querySelector('#step-body .actions');
    if(!box) return;
    el = document.createElement('span');
    el.className = 'pip';
    box.appendChild(el);
  }
  el.innerHTML = `<i></i>字幕提取中（${ing}）`;
}

let videoTimer = null;
function openVideo(title){
  let cur = 12, dur = 143, playing = true, speed = 1;
  overlay.innerHTML = `
    <div class="vmask">
      <div class="vbox">
        <div class="vh">${title}<span class="x" data-x>✕</span></div>
        <div class="screen">
          <div class="ph"><div class="big">剧集画面预览</div>演示占位视频 · 实际为源片播放</div>
        </div>
        <div class="vc">
          <span class="ico" data-play>❚❚</span>
          <span class="txt"><span data-cur>00:12</span> / 02:23</span>
          <div class="bar"><i style="width:8%"></i></div>
          <span class="ico" data-speed style="font-size:11px;width:auto">1x</span>
          <span class="ico">🔊</span>
          <svg class="ico" viewBox="0 0 16 16" fill="#606266"><path d="M1 1h10v10H1zM12 4l3-2v10l-3-2z"/></svg>
        </div>
      </div>
    </div>`;
  const close = ()=>{ clearInterval(videoTimer); overlay.innerHTML=''; };
  overlay.querySelector('[data-x]').onclick = close;
  overlay.querySelector('.vmask').addEventListener('click', e=>{
    if(e.target.classList.contains('vmask')) close();
  });
  const curEl = overlay.querySelector('[data-cur]');
  const barEl = overlay.querySelector('.bar i');
  const playEl = overlay.querySelector('[data-play]');
  const sp = overlay.querySelector('[data-speed]');
  const tick = ()=>{
    if(!playing) return;
    cur += speed*0.5;
    if(cur>=dur){ cur=dur; playing=false; playEl.textContent='▶'; }
    const m = String(Math.floor(cur/60)).padStart(2,'0');
    const s = String(Math.floor(cur%60)).padStart(2,'0');
    curEl.textContent = m+':'+s;
    barEl.style.width = (cur/dur*100)+'%';
  };
  videoTimer = setInterval(tick, 500);
  playEl.onclick = ()=>{ playing=!playing; playEl.textContent = playing?'❚❚':'▶'; };
  sp.onclick = ()=>{ speed = speed===1?1.5:speed===1.5?2:1; sp.textContent = speed+'x'; };
  overlay.querySelector('.bar').onclick = e=>{
    const r = e.currentTarget.getBoundingClientRect();
    cur = Math.max(0, Math.min(dur, (e.clientX-r.left)/r.width*dur));
  };
}

      <div class="form-item"><div class="lab">${(row.src||'').indexOf('ASR')===0?'ASR 引擎':'OCR 引擎'}</div><div class="ctl" style="line-height:30px">${(row.src||'').indexOf('ASR')===0?(row.api==='鬼手'?'GhostCut ASR-v2 · 中文':'通用 ASR'):'PaddleOCR-v4 · 中文增强'}</div></div>
      <div class="form-item"><div class="lab">原始日志</div>
        <div class="ctl"><div style="background:#f7f8fa;border:1px solid #ebeef5;border-radius:3px;padding:9px 10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#606266;line-height:1.7">
          ${(row.src||'').indexOf('ASR')===0?`[17:14:52] start asr, video=88181.mp4<br>
          [17:14:55] demux audio track, 44.1kHz mono<br>
          [17:15:26] asr done, lines=58, avg_conf=0.962<br>
          [17:15:28] save to subtitle_lib ok`:`[17:14:52] start extract, video=88181.mp4<br>
          [17:15:06] keyframes=1420, detect=1398<br>
          [17:15:41] ocr done, lines=58, avg_conf=0.962<br>
          [17:15:43] save to subtitle_lib ok`}
        </div></div></div>`,
    footer:`<button class="btn btn-primary" data-close-dlg>关 闭</button>`
  });
}

/* =========================================================
   事件分发
   ========================================================= */
const ACT = {
  'add-collection': ()=> collectionForm('add'),
  'edit-collection': id=> collectionForm('edit', COLLECTIONS.find(c=>c.id===+id)),
  'del-collection': id=>{
    const row = COLLECTIONS.find(c=>c.id===+id);
    confirmDlg('删除合集', `确定要删除合集「${row.name}」吗？删除后该合集下的源片与字幕将不可恢复。`, ()=>{
      const i = COLLECTIONS.indexOf(row);
      if(i>-1) COLLECTIONS.splice(i,1);
      go('list'); toast('删除成功');
    });
  },
  'namecard': id=> nameCardDlg(COLLECTIONS.find(c=>c.id===+id)),
  'search-list': ()=> renderList(),
  'reset-list': ()=>{ state.list={fName:'',fRemark:'',team:'',page:1}; renderList(); toast('已重置筛选条件','info'); },
  'open-detail': id=>{
    const row = COLLECTIONS.find(c=>c.id===+id);
    if(!DETAIL[row.id]){
      toast('该合集暂无明细数据，已进入「产品测试合集」演示','info');
      state.detail.id = 1507;
    } else {
      state.detail.id = row.id;
    }
    state.detail.step='first'; state.detail.sel.clear();
    if(!state.openTabs.find(t=>t.key==='detail'))
      state.openTabs.push({key:'detail',label:'合集详情',hash:'#'});
    go('detail');
  },
  'step': k=>{ state.detail.step=k; state.detail.sel.clear(); renderDetail(); },
  'subtab': k=>{ state.detail.subTab=k; renderStep(); },
  'trans-tab': k=>{ state.detail.transTab=k; renderStep(); },
  'term-tab': k=>{ state.detail.termTab=k; renderStep(); },
  'dub-tab': k=>{ state.detail.dubTab=k; renderStep(); },
  'chip': c=>{ state.detail.chip=c; renderStep(); toast('已切换到'+c+'字幕'); },
  'status': ()=> toast('演示版本：状态筛选已展示全部数据','info'),
  'do-search': ()=> toast('查询完成'),
  'reset-filter': ()=> renderStep(),
  'upload-video': ()=> uploadVideoDlg(),
  'upload-log': ()=> openUploadDrawer('ing'),
  'select-lib': ()=> selectLibDlg(),
  'extract-sub': ()=>{ if(needSelect('提取字幕')) extractSubDlg(); },
  'erase-sub': ()=>{
    if(!needSelect('字幕擦除')) return;
    confirmDlg('字幕擦除', `已选 ${state.detail.sel.size} 个源片，是否提交字幕擦除任务？`, ()=>{
      toast('字幕擦除任务已提交（演示）');
    });
  },
  'music-sub': ()=>{
    if(!needSelect('音乐分离')) return;
    confirmDlg('音乐分离', `已选 ${state.detail.sel.size} 个源片，是否提交人声/背景音乐分离任务？`, ()=>{
      toast('音乐分离任务已提交（演示）');
    });
  },
  'prev-ep': ()=>{
    const ex=state.extract; if(!ex) return;
    const n = state.extract.ids.length;
    if(ex.idx<=0) return;
    ex.idx--; renderExtract();
  },
  'next-ep': ()=>{
    const ex=state.extract; if(!ex) return;
    if(ex.idx>=ex.ids.length-1) return;
    ex.idx++; renderExtract();
  },
  'pick-ep': ()=>{
    if(!state.extract) return;
    state.extract.picking = !state.extract.picking;
    renderExtract();
  },
  'pick-ep-item': i=>{
    const ex=state.extract; if(!ex) return;
    ex.idx = +i; ex.picking = false; renderExtract();
  },
  'play-toggle': ()=>{
    const ex=state.extract; if(!ex) return;
    ex.playing = !ex.playing;
    const p=document.getElementById('vplay');
    if(p) p.textContent = ex.playing?'❚❚':'▶';
    if(ex.t>=ex.dur && ex.playing) ex.t = 0;
  },
  'speed': ()=>{
    const ex=state.extract; if(!ex) return;
    ex.speed = ex.speed===1?1.5:ex.speed===1.5?2:1;
    const el=document.querySelector('[data-act="speed"]');
    if(el) el.textContent = ex.speed+'x';
  },
  'mute': ()=>{
    const ex=state.extract; if(!ex) return;
    ex.muted = !ex.muted;
    const el=document.getElementById('vmute');
    if(el) el.textContent = ex.muted?'🔇':'🔊';
  },
  'seek': (id, el, e)=>{
    const ex=state.extract; if(!ex) return;
    const r = el.getBoundingClientRect();
    const x = e.clientX;
    ex.t = clampN((x-r.left)/r.width, 0, 1)*ex.dur;
    const bar=document.getElementById('vbar'); if(bar) bar.style.width=(ex.t/ex.dur*100)+'%';
    const cur=document.getElementById('vcur'); if(cur) cur.textContent=fmtT(ex.t);
  },
  'start-ocr': ()=>{
    const ex = state.extract;
    if(!ex) return;
    const d = DETAIL[state.detail.id];
    const rows = d.first.filter(r=>ex.ids.includes(r.id));
    const way = ex.way, api = ex.api;
    clearInterval(exTimer);
    state.extract = null;
    state.openTabs = state.openTabs.filter(t=>t.key!=='extract');
    state.detail.step = 'sub';
    go('detail');
    submitExtract(rows.length?rows:[{name:d.first[0].name, id:d.first[0].id}], way, api, 0);
  },
  'download': ()=> toast('已开始打包下载（演示）'),
  'preview': out=> openVideo(out==='音频'?'音频试听 · 英语 模板三':'长视频预览 · 英语 模板三'),
  'view-video': id=>{
    const row = DETAIL[state.detail.id].first.find(r=>r.id===id);
    openVideo(row?row.name:'视频预览');
  },
  'rename-ep': id=>{
    const d = DETAIL[state.detail.id];
    const row = d.first.find(r=>r.id===id);
    dialog({
      title:'修改剧集名称',
      body:`<div class="form-item"><div class="lab">剧集名称</div>
        <div class="ctl"><input class="inp" id="epName" value="${row.name}" maxlength="60"></div></div>`,
      footer:`<button class="btn" data-close-dlg>取 消</button><button class="btn btn-primary" data-ok>确 定</button>`,
      onMount(close){
        overlay.querySelector('[data-ok]').onclick = ()=>{
          const v = document.getElementById('epName').value.trim();
          if(!v){ toast('剧集名称不能为空','err'); return; }
          row.name = v; close(); renderStep(); toast('修改成功');
        };
      }
    });
  },
  'del-ep': id=>{
    const d = DETAIL[state.detail.id];
    const row = d.first.find(r=>r.id===id);
    confirmDlg('删除源片', `确定要删除源片「${row.name}」吗？`, ()=>{
      d.first = d.first.filter(r=>r.id!==id);
      state.detail.sel.delete(id);
      renderStep(); toast('删除成功');
    });
  },
  'audit-sub': id=> subtitleAuditDlg(id),
  'extract-detail': id=> extractDetailDlg(id),
  'trans-detail': id=> transDetailDlg(id),
  'process-detail': v=>{
    const [kind,lang] = v.split('|');
    processDetailDlg(kind, lang);
  },
  'simple-tip': t=> toast(`「${t}」功能演示版本未接入`,'info'),
  'gen-term': ()=> toast('术语表生成任务已提交（演示）')
};

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act==='ck-row'){
    const rid = id;
    if(el.checked) state.detail.sel.add(rid); else state.detail.sel.delete(rid);
    const footer = document.querySelector('.tbl-footer');
    if(footer && footer.textContent.includes('已选择'))
      footer.firstElementChild.textContent = '已选择 '+state.detail.sel.size+' 项';
    return;
  }
  if(act==='ck-all'){
    const boxes = document.querySelectorAll('[data-act="ck-row"]');
    boxes.forEach(b=>{ b.checked = el.checked; el.checked?state.detail.sel.add(b.dataset.id):state.detail.sel.delete(b.dataset.id); });
    const footer = document.querySelector('.tbl-footer');
    if(footer) footer.firstElementChild.textContent = '已选择 '+state.detail.sel.size+' 项';
    return;
  }
  if(act==='select'){ return; }
  const fn = ACT[act];
  if(fn) fn(id, el, e);
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ overlay.innerHTML=''; clearInterval(videoTimer); }
});

document.getElementById('btnFullscreen').addEventListener('click', ()=>{
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); toast('已进入全屏','info'); }
  else { document.exitFullscreen?.(); }
});
document.getElementById('globalSearch').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const v = e.target.value.trim();
  if(state.route.page==='list'){ state.list.fName=v; renderList(); toast('已按「'+v+'」筛选'); }
  else toast('全局搜索：'+v+'（演示）','info');
});

/* 启动 */
go('list');
</script>
</body>
</html>
